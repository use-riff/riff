name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with local development (README). Each download below is
  # pinned to a SHA-256 hash; update the hash together with the version.
  SOLANA_VERSION: 4.1.2
  SOLANA_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
  ANCHOR_VERSION: 1.2.0
  ANCHOR_SHA256: 0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  program:
    name: Build, test, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Solana CLI and SBF platform tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          dir="$HOME/.local/share/solana/install/active_release"
          if [ ! -x "$dir/bin/cargo-build-sbf" ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 \
              "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            echo "${SOLANA_SHA256}  /tmp/solana.tar.bz2" | sha256sum -c -
            mkdir -p "$(dirname "$dir")"
            tar -xjf /tmp/solana.tar.bz2 -C "$(dirname "$dir")"
            mv "$(dirname "$dir")/solana-release" "$dir"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/anchor \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          echo "${ANCHOR_SHA256}  /tmp/anchor" | sha256sum -c -
          install -m 0755 /tmp/anchor "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (SBPF v0)
        run: make build

      - name: Build for devnet
        run: make build-devnet

      - name: Test
        run: cargo test

      - name: Test devnet addresses
        run: cargo test -p riff --lib --features devnet

      - name: Committed IDL matches the program
        run: make idl && git diff --exit-code clients/ts/src/idl

      - name: Curve test vectors match the program
        run: |
          cargo test -p riff --test curve_vectors -- --ignored
          git diff --exit-code clients/ts/test/curve-vectors.json

      - name: Clippy
        run: make lint

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies (pnpm version from package.json)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r typecheck

      - name: Client tests (curve math matches the program)
        run: pnpm -C clients/ts test

      - name: App tests (upload validation)
        run: pnpm -C app test

      - name: Build the app
        run: pnpm -C app build

      - name: Audit JavaScript dependencies (fails on high or critical)
        run: pnpm audit --audit-level high

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit@0.22.2

      # Fails on known vulnerabilities. Unmaintained/unsound warnings are
      # reported but don't fail the build.
      - name: Audit dependencies
        run: cargo audit

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan for secrets
        run: /tmp/gitleaks git --redact --no-banner .
